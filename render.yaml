# Render Blueprint for the MCP research agent.
#
# No `databases:` block on purpose — this reuses the Postgres created for the
# document agent. Render's free tier allows only one free database per account,
# so declaring another here would fail the deploy.
#
# The browser never calls this service. The Alectos gateway does, holding
# BACKEND_API_KEY on its side, which is why ALLOWED_ORIGINS stays empty.
services:
  - type: web
    name: mcp-ai-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKEND_API_KEY
        sync: false          # same value goes in the gateway's RESEARCH_BACKEND_API_KEY
      - key: TAVILY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false          # Internal Database URL of the existing alectos database
      - key: ALLOWED_ORIGINS
        value: ""            # no direct browser access; the gateway is the only caller
      - key: MODEL
        value: gemini-3.5-flash-lite   # matches your local .env
      - key: MAX_TOKENS
        value: "8192"
